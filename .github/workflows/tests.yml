name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  delta:
    name: SCAP delta scorer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests/ -v

  ansible:
    name: Ansible lint + syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core
      - name: install roles
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - name: syntax check
        run: ansible-playbook ansible/site.yml --syntax-check -i localhost,
